<!DOCTYPE html>
<html>

<head>
    <title>Bookstore Survey</title>
</head>

<body>
    <h1>School Bookstore Survey</h1>
    <form>

        <h2>Student Information</h2>

        <label>Name:</label>
        <input type="text" name="name">
        <br><br>

        <label>Address:</label>
        <textarea name="address" rows="3" cols="30"></textarea>
        <br><br>

        <label>City:</label>
        <input type="text" name="city">
        <br><br>

        <label>Pin Code:</label>
        <input type="text" name="Pincode">
        <br><br>

        <label>Email ID:</label>
        <input type="email" name="email">
        <br><br>

        <h3>Book-Buying Survey</h3>

        <label>Where do you get your books?</label>
        <br>

        <input type="radio" name="purchase" value="bookstore">
        School Bookstore
        <br>

        <input type="radio" name="purchase" value="online">
        Online Store
        <br>

        <input type="radio" name="purchase" value="local">
        Local Book Shop
        <br>

        <input type="radio" name="purchase" value="other">
        Other
        <br><br>

        <label>How Frequently do you purchase new books?</label>
        <br>

        <select name="frequency">
            <option>Every Month</option>
            <option>Every 2 Months</option>
            <option>Every 4 Months</option>
            <option>Every 6 Months</option>
        </select>

        <br><br>

        <label>What genres of book do you normally purchase?</label>
        <br>

        <input type="checkbox" name="books" value="textbooks">
        Textbooks
        <br>

        <input type="checkbox" name="books" value="reference">
        Reference Books
        <br>

        <input type="checkbox" name="books" value="novels">
        Novels
        <br>

        <input type="checkbox" name="books" value="
philosophical">
        philosophical
        <br><br>

        <label>Comments:</label>
        <br>
        <textarea name="comments" rows="4" cols="40"></textarea>

        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>
</body>

</html>
