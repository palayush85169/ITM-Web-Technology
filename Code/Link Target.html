<!DOCTYPE html>
<html>
<head>
    <title>Link Targets</title>
</head>
<body>
 <h1>Demonstration of Link Targets</h1>

    <h2>1. Open in Same Window</h2>
    <a href="https://www.google.com" target="_self">
        Open Google in Same Window
    </a>

    <h2>2. Open in New Window</h2>
    <a href="https://www.google.com" target="_blank">
        Open Google in New Window
    </a>

    <h2>3. Open in Parent Window</h2>
    <a href="https://www.wikipedia.org" target="_parent">
        Open Wikipedia in Parent Window
    </a>

    <h2>4. Open in Full Window</h2>
    <a href="https://www.Youtube.com" target="_top">
        Open Youtube in Full Window
    </a>
   
</body>
</html>
